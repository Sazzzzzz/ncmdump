<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="网易云音乐 .ncm 文件解密工具" />
  <title>NCM 解压</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="container">
    <header>
      <h1>NCMDump</h1>
      <p class="subtitle">
        <a class="github-icon" href="https://github.com/Sazzzzzz/ncmdump" target="_blank" rel="noopener noreferrer"
          aria-label="GitHub 仓库">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z">
            </path>
          </svg>
        </a>
        网易云音乐 .ncm 文件本地解密工具
      </p>
    </header>

    <div id="drop-zone" class="drop-zone" role="button" tabindex="0">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 18V5l12-2v13" />
        <circle cx="6" cy="18" r="3" />
        <circle cx="18" cy="16" r="3" />
      </svg>
      <p class="dz-title">拖拽 .ncm 文件到此处</p>
      <p class="dz-sub">或点击选择文件</p>
      <input type="file" id="file-input" accept=".ncm" multiple hidden />
    </div>

    <ul id="status-list" class="status-list"></ul>

    <footer>文件仅在本地浏览器内处理，不会上传至任何服务器</footer>
  </main>

  <script type="module" src="./main.js"></script>
</body>

</html>
